<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CodeSage</title>

        <!-- Highlight.js themes -->
        <link
            rel="stylesheet"
            href="lib/github.min.css"
            id="hljs-theme-light"
        />
        <link
            rel="stylesheet"
            href="lib/github-dark.min.css"
            id="hljs-theme-dark"
            disabled
        />

        <!-- Font Awesome (self-hosted) -->
        <link rel="stylesheet" href="lib/font-awesome/all.min.css" />

        <!-- Design system -->
        <link rel="stylesheet" href="styles/tokens.css" />
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/animations.css" />
        <link rel="stylesheet" href="styles/layout.css" />
        <link rel="stylesheet" href="styles/session-popover.css" />
        <link rel="stylesheet" href="styles/chat.css" />
        <link rel="stylesheet" href="styles/input.css" />
        <link rel="stylesheet" href="styles/markdown.css" />
        <link rel="stylesheet" href="styles/components.css" />
        <link rel="stylesheet" href="styles/settings.css" />
        <link rel="stylesheet" href="styles/empty-state.css" />
        <link rel="stylesheet" href="styles/polish.css" />

        <!-- Vendor: highlight.js -->
        <script src="lib/highlight.min.js"></script>
        <script src="lib/languages/kotlin.min.js"></script>
        <script src="lib/languages/java.min.js"></script>
        <script src="lib/languages/python.min.js"></script>
        <script src="lib/languages/javascript.min.js"></script>
        <script src="lib/languages/typescript.min.js"></script>
        <script src="lib/languages/go.min.js"></script>
        <script src="lib/languages/rust.min.js"></script>
        <script src="lib/languages/xml.min.js"></script>
        <script src="lib/languages/css.min.js"></script>
        <script src="lib/languages/json.min.js"></script>
        <script src="lib/languages/yaml.min.js"></script>
        <script src="lib/languages/bash.min.js"></script>
        <script src="lib/languages/sql.min.js"></script>
    </head>
    <body>
        <script>
            // Initial theme: read from Kotlin injection
            (function () {
                try {
                    var t =
                        typeof window.__CODESAGE_INITIAL_THEME__ === "string"
                            ? window.__CODESAGE_INITIAL_THEME__
                            : "auto";
                    if (t === "auto") {
                        t =
                            window.matchMedia &&
                            window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                                ? "dark"
                                : "light";
                    }
                    document.documentElement.setAttribute("data-theme", t);
                    document.body.setAttribute("data-theme", t);
                } catch (e) {
                    /* ignore */
                }
            })();
        </script>

        <a href="#messages-container" class="cs-skip-link">跳到主内容</a>

        <div class="app-container" id="app-container">
            <!-- O5.2/O5.3: 删除了常驻侧边栏与工件面板,改为单栏全宽 -->
            <!-- ============== Main Area ============== -->
            <div class="main-area">
                <!-- Settings view (overlays chat content when active) -->
                <div
                    class="cs-settings-root"
                    id="cs-settings-root"
                    style="display: none"
                ></div>

                <!-- Header -->
                <header class="chat-header">
                    <div class="header-left">
                        <!-- O5.2: 常驻侧边栏删除,改为点击按钮唤出历史会话弹出框 -->
                        <button
                            class="icon-btn session-history-btn"
                            id="session-history-btn"
                            data-cs-tooltip="历史会话 (Cmd+Shift+L)"
                            aria-label="历史会话"
                        >
                            <i class="fas fa-clock-rotate-left"></i>
                        </button>
                        <div class="brand">
                            <div class="brand-mark" aria-label="CodeSage">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" />
                                    <path d="M12 22V12" />
                                    <path d="M4 7l8 5 8-5" />
                                </svg>
                            </div>
                            <span class="brand-text">CodeSage</span>
                        </div>
                        <span
                            class="session-title"
                            id="session-title"
                            title=""
                        ></span>
                    </div>
                    <div class="header-right">
                        <!-- Model selector -->
                        <div class="model-selector" id="model-selector">
                            <button
                                class="model-pill"
                                id="model-pill-btn"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                            >
                                <span class="model-dot"></span>
                                <span class="model-name" id="model-name"
                                    >选择模型</span
                                >
                                <i class="fas fa-chevron-down chevron"></i>
                            </button>
                            <div
                                class="model-dropdown"
                                id="model-dropdown"
                                role="listbox"
                            ></div>
                        </div>

                        <!-- O5.3: 工件面板删除,移除 toggle 按钮 -->
                        <button
                            class="icon-btn"
                            id="thinking-toggle-btn"
                            data-cs-tooltip="显示/隐藏思考过程"
                            aria-label="切换思考过程"
                        >
                            <i
                                class="fas fa-brain"
                                id="thinking-toggle-icon"
                            ></i>
                        </button>

                        <button
                            class="icon-btn"
                            id="theme-toggle-btn"
                            data-cs-tooltip="切换主题"
                            aria-label="切换主题"
                        >
                            <i class="fas fa-moon" id="theme-icon"></i>
                        </button>

                        <button
                            class="icon-btn"
                            id="settings-btn"
                            data-cs-tooltip="设置"
                            aria-label="设置"
                        >
                            <i class="fas fa-gear"></i>
                        </button>

                        <button
                            class="icon-btn danger"
                            id="new-session-btn"
                            data-cs-tooltip="新会话"
                            aria-label="新会话"
                        >
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </header>

                <!-- Messages -->
                <div
                    class="messages-container"
                    id="messages-container"
                    tabindex="-0"
                >
                    <div class="messages-inner" id="messages-inner">
                        <!-- Welcome state (default empty) -->
                        <div class="welcome-state" id="welcome-state">
                            <div class="welcome-mark">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M12 2L4 7v10l8 5 8-5V7l-8-5z" />
                                    <path d="M12 22V12" />
                                    <path d="M4 7l8 5 8-5" />
                                </svg>
                            </div>
                            <h1 class="welcome-title">欢迎使用 CodeSage</h1>
                            <p class="welcome-subtitle">
                                你的 AI
                                编码助手,直接对话即可读改文件、执行命令、生成代码。
                            </p>
                            <div class="welcome-actions" id="welcome-actions">
                                <!-- JS dynamically injects starter prompts -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status line (above input, only when generating) -->
                <div class="status-line" id="status-line" hidden>
                    <span class="status-pulse"></span>
                    <span id="status-text">就绪</span>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-container" id="input-container">
                        <div class="context-chips" id="context-chips"></div>
                        <div
                            class="input-attachments"
                            id="input-attachments"
                        ></div>
                        <div class="input-textarea-wrap">
                            <textarea
                                class="input-textarea"
                                id="input-textarea"
                                placeholder="问点代码相关的问题… (Shift+Enter 换行,Enter 发送)"
                                rows="1"
                                autocomplete="off"
                                spellcheck="false"
                            ></textarea>
                            <span
                                class="input-char-count"
                                id="input-char-count"
                                aria-live="polite"
                                >0 / 4000</span
                            >
                        </div>
                        <div class="input-toolbar">
                            <div class="input-toolbar-left">
                                <button
                                    class="input-tool-btn"
                                    id="attach-btn"
                                    data-cs-tooltip="添加文件"
                                    aria-label="添加文件"
                                >
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <button
                                    class="input-tool-btn"
                                    id="image-btn"
                                    data-cs-tooltip="添加图片"
                                    aria-label="添加图片"
                                >
                                    <i class="fas fa-image"></i>
                                </button>
                                <button
                                    class="input-tool-btn"
                                    id="mention-btn"
                                    data-cs-tooltip="提及 @"
                                    aria-label="提及"
                                >
                                    <i class="fas fa-at"></i>
                                </button>
                                <div
                                    class="mode-tabs"
                                    id="mode-tabs"
                                    role="tablist"
                                >
                                    <button
                                        class="mode-tab"
                                        data-mode="chat"
                                        title="普通对话"
                                    >
                                        <i class="fas fa-comments"></i>
                                        <span>Chat</span>
                                    </button>
                                    <button
                                        class="mode-tab"
                                        data-mode="agent"
                                        title="Agent 模式(自动调用工具)"
                                    >
                                        <i class="fas fa-bolt"></i>
                                        <span>Agent</span>
                                    </button>
                                    <button
                                        class="mode-tab"
                                        data-mode="plan"
                                        title="先出计划再执行"
                                    >
                                        <i class="fas fa-list-check"></i>
                                        <span>Plan</span>
                                    </button>
                                </div>
                            </div>
                            <div class="input-toolbar-right">
                                <button
                                    class="send-btn"
                                    id="send-btn"
                                    aria-label="发送"
                                    data-cs-tooltip="发送 (Enter)"
                                >
                                    <i class="fas fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="input-hint">
                        <div class="input-hint-left">
                            <span><kbd>Enter</kbd> 发送</span>
                            <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
                        </div>
                        <div class="input-hint-right">
                            <span id="hint-model">—</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Toast container -->
        <div class="cs-toast-container" id="cs-toast-container"></div>

        <!-- Application entry (ESM) -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
