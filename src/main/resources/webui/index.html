<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CodeSage Chat</title>

        <!-- Highlight.js themes (light/dark) -->
        <link
            rel="stylesheet"
            href="lib/github.min.css"
            id="hljs-theme-light"
        />
        <link
            rel="stylesheet"
            href="lib/github-dark.min.css"
            id="hljs-theme-dark"
            disabled
        />

        <!-- Font Awesome (self-hosted) -->
        <link rel="stylesheet" href="lib/font-awesome/all.min.css" />

        <!-- Design system: tokens first, then everything else -->
        <link rel="stylesheet" href="styles/tokens.css" />
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/animations.css" />
        <link rel="stylesheet" href="styles/layout.css" />
        <link rel="stylesheet" href="styles/chat.css" />
        <link rel="stylesheet" href="styles/input.css" />
        <link rel="stylesheet" href="styles/markdown.css" />
        <link rel="stylesheet" href="styles/sidebar.css" />
        <link rel="stylesheet" href="styles/settings.css" />
        <link rel="stylesheet" href="styles/polish.css" />
        <link rel="stylesheet" href="styles/components.css" />

        <!-- Vendor: highlight.js (loaded synchronously so hljs is ready early) -->
        <script src="lib/highlight.min.js"></script>
        <script src="lib/languages/kotlin.min.js"></script>
        <script src="lib/languages/java.min.js"></script>
        <script src="lib/languages/python.min.js"></script>
        <script src="lib/languages/javascript.min.js"></script>
        <script src="lib/languages/typescript.min.js"></script>
        <script src="lib/languages/go.min.js"></script>
        <script src="lib/languages/rust.min.js"></script>
        <script src="lib/languages/xml.min.js"></script>
        <script src="lib/languages/css.min.js"></script>
        <script src="lib/languages/json.min.js"></script>
        <script src="lib/languages/yaml.min.js"></script>
        <script src="lib/languages/bash.min.js"></script>
        <script src="lib/languages/sql.min.js"></script>
    </head>
    <body>
        <script>
            // 初始主题：优先采用 Kotlin 注入的 __CODESAGE_INITIAL_THEME__，否则跟随系统偏好
            (function () {
                try {
                    var t =
                        typeof window.__CODESAGE_INITIAL_THEME__ === "string"
                            ? window.__CODESAGE_INITIAL_THEME__
                            : "auto";
                    if (t === "auto") {
                        t =
                            window.matchMedia &&
                            window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                                ? "dark"
                                : "light";
                    }
                    document.documentElement.setAttribute("data-theme", t);
                } catch (e) {
                    /* ignore */
                }
            })();
        </script>
        <a href="#messages-container" class="cs-skip-link">跳到主内容</a>
        <div class="app-container">
            <div class="main-area">
                <!-- ========== Header ========== -->
                <div class="chat-header">
                    <div class="header-brand">
                        <div class="brand-icon" aria-label="CodeSage">
                            <svg viewBox="0 0 32 32" width="22" height="22">
                                <defs>
                                    <linearGradient
                                        id="cs-brand-grad"
                                        x1="0%"
                                        y1="0%"
                                        x2="100%"
                                        y2="100%"
                                    >
                                        <stop
                                            offset="0%"
                                            stop-color="#6366f1"
                                        />
                                        <stop
                                            offset="100%"
                                            stop-color="#8b5cf6"
                                        />
                                    </linearGradient>
                                </defs>
                                <path
                                    d="M22 11 C 22 9, 19 8, 16 8 C 11 8, 8 11, 8 16 C 8 21, 11 24, 16 24 C 19 24, 22 23, 22 21"
                                    fill="none"
                                    stroke="white"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                />
                                <circle cx="22" cy="11" r="1.8" fill="white" />
                                <circle
                                    cx="24.5"
                                    cy="9"
                                    r="0.9"
                                    fill="white"
                                    opacity="0.7"
                                />
                            </svg>
                        </div>
                        <div class="brand-title">CodeSage</div>
                    </div>
                    <div class="header-actions">
                        <button
                            class="icon-btn icon-btn-prominent"
                            data-cs-tooltip="新会话 (Cmd+N)"
                            onclick="CodeSage.chat.onNewSession()"
                        >
                            <i class="fas fa-plus"></i>
                        </button>
                        <div class="history-selector" id="history-selector">
                            <button
                                class="icon-btn icon-btn-prominent"
                                id="history-btn"
                                data-cs-tooltip="历史会话"
                                onclick="CodeSage.chat.toggleHistoryDropdown()"
                            >
                                <i class="fas fa-clock-rotate-left"></i>
                            </button>
                            <div
                                class="history-dropdown"
                                id="history-dropdown"
                            ></div>
                        </div>
                        <button
                            class="icon-btn"
                            data-cs-tooltip="命令面板 (Cmd+K)"
                            onclick="CodeSage.openCommandPalette()"
                        >
                            <i class="fas fa-terminal"></i>
                        </button>
                        <button
                            class="icon-btn"
                            id="thinking-toggle-btn"
                            data-cs-tooltip="显示/隐藏思考过程"
                            onclick="CodeSage.chat.toggleThinkingVisibility()"
                        >
                            <i
                                class="fas fa-brain"
                                id="thinking-toggle-icon"
                            ></i>
                        </button>
                        <button
                            class="icon-btn"
                            data-cs-tooltip="切换主题"
                            onclick="CodeSage.chat.toggleTheme()"
                        >
                            <i class="fas fa-moon" id="theme-icon"></i>
                        </button>
                        <button
                            class="icon-btn danger"
                            data-cs-tooltip="清空当前会话"
                            onclick="CodeSage.chat.clearChat()"
                        >
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <button
                            class="icon-btn"
                            data-cs-tooltip="设置"
                            onclick="CodeSage.chat.showSettings()"
                        >
                            <i class="fas fa-gear"></i>
                        </button>
                    </div>
                </div>

                <!-- ========== Messages ========== -->
                <div class="messages-container" id="messages-container">
                    <div class="welcome-state" id="welcome-state">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 64 64" width="40" height="40">
                                <defs>
                                    <linearGradient
                                        id="cs-welcome-grad"
                                        x1="0%"
                                        y1="0%"
                                        x2="100%"
                                        y2="100%"
                                    >
                                        <stop
                                            offset="0%"
                                            stop-color="#6366f1"
                                        />
                                        <stop
                                            offset="100%"
                                            stop-color="#8b5cf6"
                                        />
                                    </linearGradient>
                                </defs>
                                <path
                                    d="M44 22 C 44 18, 38 16, 32 16 C 22 16, 16 24, 16 32 C 16 40, 22 48, 32 48 C 38 48, 44 46, 44 42"
                                    fill="none"
                                    stroke="white"
                                    stroke-width="4"
                                    stroke-linecap="round"
                                />
                                <circle cx="44" cy="22" r="3" fill="white" />
                                <circle
                                    cx="48"
                                    cy="18"
                                    r="1.6"
                                    fill="white"
                                    opacity="0.7"
                                />
                                <circle
                                    cx="49"
                                    cy="14"
                                    r="1"
                                    fill="white"
                                    opacity="0.5"
                                />
                            </svg>
                        </div>
                        <div class="welcome-title">CodeSage AI 助手</div>
                        <div class="welcome-subtitle">
                            我可以帮你编写代码、调试问题、重构项目、生成测试等。支持多轮对话、工具调用、代码生成。
                        </div>
                        <div class="quick-prompts">
                            <button
                                class="quick-prompt-btn"
                                onclick="
                                    CodeSage.chat.sendQuickPrompt(
                                        '解释这段代码',
                                    )
                                "
                            >
                                <i class="fas fa-book-open"></i>&nbsp;解释代码
                            </button>
                            <button
                                class="quick-prompt-btn"
                                onclick="
                                    CodeSage.chat.sendQuickPrompt(
                                        '重构这段代码',
                                    )
                                "
                            >
                                <i class="fas fa-sync-alt"></i>&nbsp;重构代码
                            </button>
                            <button
                                class="quick-prompt-btn"
                                onclick="
                                    CodeSage.chat.sendQuickPrompt(
                                        '生成单元测试',
                                    )
                                "
                            >
                                <i class="fas fa-vial"></i>&nbsp;生成测试
                            </button>
                            <button
                                class="quick-prompt-btn"
                                onclick="
                                    CodeSage.chat.sendQuickPrompt(
                                        '修复代码中的bug',
                                    )
                                "
                            >
                                <i class="fas fa-bug"></i>&nbsp;修复 Bug
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ========== Input Area ========== -->
                <div class="input-area-wrapper">
                    <div class="input-box" id="input-box">
                        <div
                            id="file-autocomplete"
                            class="file-autocomplete"
                        ></div>
                        <textarea
                            id="message-input"
                            class="input-textarea"
                            placeholder="输入消息... (Enter 发送, Shift+Enter 换行, @引用文件)"
                            rows="1"
                        ></textarea>
                        <div class="input-box-bottom">
                            <!-- AI 运行模式 (Agent / Ask / Manual) -->
                            <div
                                class="mode-selector-bottom"
                                id="mode-selector-bottom"
                            >
                                <button
                                    class="mode-dropdown-btn"
                                    id="mode-dropdown-btn"
                                    data-cs-tooltip="选择 AI 运行模式"
                                    onclick="CodeSage.chat.toggleModeDropdown()"
                                >
                                    <i class="fas fa-sliders"></i>
                                    <span id="current-mode-label">Agent</span>
                                    <i
                                        class="fas fa-chevron-down chevron-tiny"
                                    ></i>
                                </button>
                                <div class="mode-dropdown" id="mode-dropdown">
                                    <button
                                        class="mode-option"
                                        data-mode="agent"
                                        onclick="
                                            CodeSage.chat.selectMode('agent')
                                        "
                                    >
                                        <i
                                            class="fas fa-wand-magic-sparkles"
                                        ></i>
                                        <div class="mode-option-body">
                                            <div class="mode-option-label">
                                                Agent
                                            </div>
                                            <div class="mode-option-desc">
                                                AI 自动规划并使用工具
                                            </div>
                                        </div>
                                    </button>
                                    <button
                                        class="mode-option"
                                        data-mode="ask"
                                        onclick="
                                            CodeSage.chat.selectMode('ask')
                                        "
                                    >
                                        <i class="fas fa-comments"></i>
                                        <div class="mode-option-body">
                                            <div class="mode-option-label">
                                                Ask
                                            </div>
                                            <div class="mode-option-desc">
                                                仅对话，不调用工具
                                            </div>
                                        </div>
                                    </button>
                                    <button
                                        class="mode-option"
                                        data-mode="manual"
                                        onclick="
                                            CodeSage.chat.selectMode('manual')
                                        "
                                    >
                                        <i class="fas fa-hand-pointer"></i>
                                        <div class="mode-option-body">
                                            <div class="mode-option-label">
                                                Manual
                                            </div>
                                            <div class="mode-option-desc">
                                                手动选择工具
                                            </div>
                                        </div>
                                    </button>
                                </div>
                            </div>
                            <!-- 模型选择 (与 mode 同款) -->
                            <div
                                class="mode-selector-bottom"
                                id="model-selector-bottom"
                            >
                                <button
                                    class="mode-dropdown-btn"
                                    id="model-select-btn"
                                    data-cs-tooltip="选择模型"
                                    onclick="
                                        CodeSage.chat.toggleModelDropdown()
                                    "
                                >
                                    <i class="fas fa-microchip"></i>
                                    <span id="current-model-name"
                                        >选择模型</span
                                    >
                                    <i
                                        class="fas fa-chevron-down chevron-tiny"
                                    ></i>
                                </button>
                                <div
                                    class="mode-dropdown"
                                    id="model-dropdown"
                                ></div>
                            </div>
                            <span
                                class="status-text status-inline"
                                id="status-label"
                                >就绪</span
                            >
                            <span class="char-counter" id="char-counter"
                                >0 / 4000</span
                            >
                            <button
                                id="send-btn"
                                class="send-btn"
                                data-cs-tooltip="发送消息 (Enter)"
                                onclick="CodeSage.chat.sendMessage()"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    width="14"
                                    height="14"
                                    fill="none"
                                >
                                    <path
                                        d="M12 5 L12 19 M5 12 L12 5 L19 12"
                                        stroke="currentColor"
                                        stroke-width="2.2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </button>
                            <button
                                id="stop-btn"
                                class="stop-btn hidden"
                                data-cs-tooltip="停止生成 (Esc)"
                                onclick="CodeSage.chat.stopGeneration()"
                            >
                                <i class="fas fa-stop"></i>
                            </button>
                        </div>
                        <div
                            class="input-resize-handle"
                            id="input-resize-handle"
                            data-cs-tooltip="拖拽调整输入框高度"
                        >
                            <i class="fas fa-grip-lines"></i>
                        </div>
                    </div>
                    <div class="input-hint">
                        <kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> +
                        <kbd>Enter</kbd> 换行 · <kbd>@</kbd> 引用文件 ·
                        <kbd>⌘K</kbd> 命令面板 · <kbd>Esc</kbd> 停止
                    </div>
                </div>
            </div>

            <!-- ========== Artifact Sidebar ========== -->
            <div id="artifact-sidebar">
                <div class="artifact-sidebar-inner">
                    <div class="artifact-sidebar-header">
                        <span class="artifact-sidebar-title">
                            <i class="fas fa-cube"></i>&nbsp;Artifacts
                        </span>
                        <button
                            class="icon-btn"
                            data-cs-tooltip="关闭"
                            onclick="CodeSage.chat.closeArtifactSidebar()"
                        >
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="artifact-list" id="artifact-list"></div>
                </div>
            </div>
        </div>

        <!-- Settings view (sibling of app-container, layered above) -->
        <div
            class="cs-settings"
            id="cs-settings-container"
            style="display: none"
        ></div>

        <!-- Toast container -->
        <div class="cs-toast-container" id="cs-toast-container"></div>

        <!-- App entry: ES modules -->
        <script type="module" src="js/main.js"></script>
    </body>
</html>
