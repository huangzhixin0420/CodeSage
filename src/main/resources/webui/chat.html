<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CodeSage Chat</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
            id="hljs-theme-dark"
            disabled
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
            id="hljs-theme-light"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/kotlin.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            :root {
                --bg-primary: #ffffff;
                --bg-secondary: #f7f7f8;
                --bg-tertiary: #ececf1;
                --bg-message-user: linear-gradient(
                    135deg,
                    #334155 0%,
                    #475569 100%
                );
                --bg-message-assistant: #f7f7f8;
                --bg-thinking: #ffffff;
                --bg-tool: #ffffff;
                --bg-code: #1e1e2e;
                --bg-artifact: #ffffff;
                --bg-input: #f7f7f8;
                --bg-hover: #ececf1;
                --text-primary: #1f1f1f;
                --text-secondary: #5f5f5f;
                --text-tertiary: #8e8e8e;
                --text-on-accent: #ffffff;
                --border-color: #e5e5e5;
                --border-subtle: #f0f0f0;
                --accent-color: #334155;
                --accent-hover: #1e293b;
                --accent-light: rgba(79, 70, 229, 0.1);
                --success-color: #10b981;
                --error-color: #ef4444;
                --warning-color: #f59e0b;
                --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
                --radius-sm: 8px;
                --radius-md: 12px;
                --radius-lg: 16px;
                --radius-xl: 20px;
                --radius-full: 9999px;
                --font-sans:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                --font-mono:
                    "JetBrains Mono", "Fira Code", "SF Mono", Monaco, monospace;
            }

            [data-theme="dark"] {
                --bg-primary: #1e1e1e;
                --bg-secondary: #262626;
                --bg-tertiary: #333333;
                --bg-message-user: linear-gradient(
                    135deg,
                    #334155 0%,
                    #475569 100%
                );
                --bg-message-assistant: #2a2a2a;
                --bg-thinking: #1e1e1e;
                --bg-tool: #262626;
                --bg-code: #14141f;
                --bg-artifact: #262626;
                --bg-input: #2d2d2d;
                --bg-hover: #3d3d3d;
                --text-primary: #e8e8e8;
                --text-secondary: #b0b0b0;
                --text-tertiary: #808080;
                --text-on-accent: #ffffff;
                --border-color: #333333;
                --border-subtle: #2a2a2a;
                --accent-color: #94a3b8;
                --accent-hover: #cbd5e1;
                --accent-light: rgba(148, 163, 184, 0.15);
                --success-color: #34d399;
                --error-color: #f87171;
                --warning-color: #fbbf24;
                --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
                --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
                --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.35);
            }

            * {
                scrollbar-width: thin;
                scrollbar-color: var(--border-color) transparent;
            }
            *::-webkit-scrollbar {
                width: 5px;
            }
            *::-webkit-scrollbar-track {
                background: transparent;
            }
            *::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 10px;
            }
            *::-webkit-scrollbar-thumb:hover {
                background: var(--text-tertiary);
            }

            body {
                font-family: var(--font-sans);
                background: var(--bg-primary);
                color: var(--text-primary);
                margin: 0;
                height: 100vh;
                overflow: hidden;
                font-size: 14px;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* ========== Animations ========== */
            @keyframes messageSlideIn {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .message-enter {
                animation: messageSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)
                    forwards;
            }

            @keyframes thinkingPulse {
                0%,
                80%,
                100% {
                    opacity: 0.25;
                    transform: scale(0.7);
                }
                40% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            .thinking-dot {
                animation: thinkingPulse 1.6s ease-in-out infinite;
            }
            .thinking-dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            .thinking-dot:nth-child(3) {
                animation-delay: 0.4s;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
            .cursor-blink {
                animation: blink 1.1s step-end infinite;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
            .fade-in {
                animation: fadeIn 0.2s ease-out;
            }

            @keyframes scaleIn {
                from {
                    opacity: 0;
                    transform: scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            .scale-in {
                animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* ========== Layout ========== */
            .app-container {
                display: flex;
                height: 100vh;
            }
            .main-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
            }

            /* ========== Header ========== */
            .chat-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                height: 52px;
                border-bottom: 1px solid var(--border-subtle);
                background: var(--bg-primary);
                flex-shrink: 0;
                z-index: 10;
            }
            .header-brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .brand-icon {
                width: 28px;
                height: 28px;
                border-radius: var(--radius-md);
                background: var(--accent-color);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 13px;
                box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
            }
            .brand-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--text-primary);
                letter-spacing: -0.2px;
            }
            .brand-subtitle {
                font-size: 11px;
                color: var(--text-tertiary);
                margin-top: -2px;
                font-weight: 500;
            }

            /* Model Selector */
            .model-selector {
                position: relative;
            }
            .model-select-btn {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 5px 10px;
                border-radius: var(--radius-sm);
                border: 1px solid var(--border-color);
                background: var(--bg-secondary);
                color: var(--text-secondary);
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s;
                font-family: var(--font-sans);
            }
            .model-select-btn:hover {
                border-color: var(--accent-color);
                background: var(--accent-light);
                color: var(--accent-color);
            }
            .model-select-btn .chevron {
                font-size: 10px;
                transition: transform 0.2s;
            }
            .model-select-btn.open .chevron {
                transform: rotate(180deg);
            }

            .model-dropdown {
                position: absolute;
                top: calc(100% + 6px);
                right: 0;
                min-width: 220px;
                width: max-content;
                max-width: 400px;
                max-height: 320px;
                overflow-y: auto;
                background: var(--bg-primary);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-lg);
                z-index: 100;
                display: none;
                padding: 6px;
            }
            .model-dropdown.open {
                display: block;
                animation: scaleIn 0.15s ease-out;
            }

            .model-group-label {
                font-size: 10px;
                font-weight: 700;
                color: var(--text-tertiary);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 6px 8px 4px;
            }
            .model-option {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 8px;
                border-radius: var(--radius-sm);
                cursor: pointer;
                font-size: 12px;
                color: var(--text-secondary);
                transition: background 0.15s;
                white-space: nowrap;
            }
            .model-option:hover {
                background: var(--bg-secondary);
                color: var(--text-primary);
            }
            .model-option.active {
                background: var(--accent-light);
                color: var(--accent-color);
                font-weight: 600;
            }
            .model-option .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--border-color);
                flex-shrink: 0;
            }
            .model-option.active .dot {
                background: var(--accent-color);
            }

            /* Header actions */
            .header-actions {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                border-radius: var(--radius-sm);
                border: none;
                background: transparent;
                color: var(--text-tertiary);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                transition: all 0.2s;
            }
            .icon-btn:hover {
                background: var(--bg-secondary);
                color: var(--text-primary);
            }
            .icon-btn.danger:hover {
                background: rgba(239, 68, 68, 0.1);
                color: var(--error-color);
            }

            /* ========== Messages ========== */
            .messages-container {
                flex: 1;
                overflow-y: auto;
                padding: 24px 16px;
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .message-user {
                display: flex;
                justify-content: flex-end;
            }
            .message-user-inner {
                max-width: 85%;
                background: var(--bg-message-user);
                color: var(--text-on-accent);
                padding: 12px 16px;
                border-radius: 18px 18px 4px 18px;
                font-size: 14px;
                line-height: 1.6;
                box-shadow: var(--shadow-sm);
            }
            .message-user-inner .at-ref {
                color: rgba(255, 255, 255, 0.85);
                font-weight: 600;
            }

            .message-assistant {
                display: flex;
                gap: 12px;
            }
            .assistant-avatar {
                width: 28px;
                height: 28px;
                border-radius: var(--radius-md);
                background: var(--accent-color);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 12px;
                flex-shrink: 0;
                margin-top: 2px;
                box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
            }
            .assistant-body {
                flex: 1;
                min-width: 0;
                max-width: 85%;
            }

            @media (min-width: 1200px) {
                .message-user-inner {
                    max-width: 70%;
                }
                .assistant-body {
                    max-width: 70%;
                }
            }
            @media (min-width: 1600px) {
                .message-user-inner {
                    max-width: 65%;
                }
                .assistant-body {
                    max-width: 65%;
                }
            }
            .assistant-meta {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 6px;
            }
            .assistant-name {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
            }
            .assistant-time {
                font-size: 11px;
                color: var(--text-tertiary);
                font-variant-numeric: tabular-nums;
            }
            .assistant-content {
                font-size: 14px;
                line-height: 1.7;
                color: var(--text-primary);
            }

            /* ========== Thinking Card ========== */
            .thinking-card {
                background: var(--bg-thinking);
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                overflow: hidden;
                margin: 8px 0;
            }
            .thinking-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                cursor: pointer;
                user-select: none;
                transition: background 0.15s;
            }
            .thinking-header:hover {
                background: var(--bg-hover);
            }
            .thinking-dots {
                display: flex;
                gap: 4px;
            }
            .thinking-dot-visual {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--warning-color);
            }
            .thinking-label {
                font-size: 12px;
                color: var(--text-tertiary);
                font-weight: 500;
            }
            .thinking-chevron {
                font-size: 10px;
                color: var(--text-tertiary);
                margin-left: auto;
                transition: transform 0.2s;
            }
            .thinking-chevron.open {
                transform: rotate(180deg);
            }
            .thinking-body {
                padding: 0 12px 10px;
                font-size: 12px;
                font-family: var(--font-mono);
                color: var(--text-secondary);
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
                display: none;
            }
            .thinking-body.open {
                display: block;
            }

            /* ========== Code Block ========== */
            .code-block {
                position: relative;
                border-radius: var(--radius-md);
                overflow: hidden;
                margin: 12px 0;
                border: 1px solid var(--border-color);
                background: var(--bg-code);
            }
            .code-block-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 14px;
                background: rgba(255, 255, 255, 0.04);
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }
            .code-lang {
                font-size: 11px;
                font-weight: 600;
                color: #a0a0b0;
                text-transform: lowercase;
                letter-spacing: 0.3px;
            }
            .code-actions {
                display: flex;
                gap: 4px;
                opacity: 0;
                transition: opacity 0.2s;
            }
            .code-block:hover .code-actions {
                opacity: 1;
            }
            .code-action-btn {
                padding: 3px 8px;
                border-radius: var(--radius-sm);
                border: none;
                background: rgba(255, 255, 255, 0.08);
                color: #c0c0d0;
                font-size: 11px;
                cursor: pointer;
                transition: background 0.15s;
                font-family: var(--font-sans);
                font-weight: 500;
            }
            .code-action-btn:hover {
                background: rgba(255, 255, 255, 0.15);
                color: #fff;
            }
            .code-block pre {
                margin: 0;
                padding: 14px;
                overflow-x: auto;
                background: transparent;
            }
            .code-block code {
                font-family: var(--font-mono);
                font-size: 13px;
                line-height: 1.6;
            }

            /* ========== Tool Card ========== */
            .tool-card {
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                overflow: hidden;
                margin: 8px 0;
                background: var(--bg-tool);
                box-shadow: var(--shadow-sm);
            }
            .tool-card-header {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                cursor: pointer;
                transition: background 0.15s;
            }
            .tool-card-header:hover {
                background: var(--bg-hover);
            }
            .tool-status-icon {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 9px;
                flex-shrink: 0;
            }
            .tool-status-running {
                background: var(--warning-color);
                color: white;
            }
            .tool-status-completed {
                background: var(--success-color);
                color: white;
            }
            .tool-status-failed {
                background: var(--error-color);
                color: white;
            }
            .tool-name {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-primary);
            }
            .tool-summary {
                font-size: 11px;
                color: var(--text-tertiary);
            }
            .tool-content {
                max-height: 0;
                overflow: hidden;
                opacity: 0;
                transition:
                    max-height 0.3s ease,
                    opacity 0.2s ease;
                padding: 0 12px;
            }
            .tool-content.open {
                max-height: 500px;
                opacity: 1;
                padding: 0 12px 10px;
            }
            .tool-content pre {
                margin: 0;
                padding: 10px;
                border-radius: var(--radius-sm);
                background: var(--bg-code);
                color: #c0c0d0;
                font-family: var(--font-mono);
                font-size: 12px;
                max-height: 240px;
                overflow-y: auto;
                line-height: 1.5;
            }

            /* ========== Artifact ========== */
            .artifact-panel {
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                background: var(--bg-artifact);
                margin: 8px 0;
                overflow: hidden;
                box-shadow: var(--shadow-sm);
            }
            .artifact-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 12px;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border-subtle);
            }
            .artifact-title {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-primary);
            }
            .artifact-actions {
                display: flex;
                gap: 4px;
            }

            /* ========== Input Area ========== */
            .input-area-wrapper {
                padding: 12px 16px 16px;
                border-top: 1px solid var(--border-subtle);
                background: var(--bg-primary);
                flex-shrink: 0;
            }
            .mode-bar {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 8px;
            }
            .mode-pill {
                padding: 4px 12px;
                border-radius: var(--radius-full);
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
                border: none;
                background: transparent;
                color: var(--text-tertiary);
                font-family: var(--font-sans);
                letter-spacing: 0.2px;
            }
            .mode-pill.active {
                background: var(--accent-light);
                color: var(--accent-color);
            }
            .mode-pill:hover:not(.active) {
                background: var(--bg-secondary);
                color: var(--text-secondary);
            }
            .status-text {
                font-size: 11px;
                color: var(--text-tertiary);
                margin-left: auto;
                font-weight: 500;
            }
            .status-text.thinking {
                color: var(--accent-color);
            }
            .status-text.error {
                color: var(--error-color);
            }

            .input-box {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                padding: 10px 14px;
                border-radius: var(--radius-xl);
                background: var(--bg-input);
                border: 1.5px solid transparent;
                transition: all 0.2s;
                position: relative;
            }
            .input-box:focus-within {
                border-color: var(--accent-color);
                background: var(--bg-primary);
                box-shadow: 0 0 0 3px var(--accent-light);
            }
            .input-textarea {
                flex: 1;
                background: transparent;
                border: none;
                outline: none;
                resize: none;
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                color: var(--text-primary);
                min-height: 22px;
                max-height: 200px;
                padding: 2px 0;
            }
            .input-textarea::placeholder {
                color: var(--text-tertiary);
            }
            .send-btn {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: none;
                background: var(--accent-color);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 12px;
                flex-shrink: 0;
                transition: all 0.2s;
                box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
            }
            .send-btn:hover {
                background: var(--accent-hover);
                transform: scale(1.05);
            }
            .send-btn:active {
                transform: scale(0.95);
            }
            .stop-btn {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: none;

        <script>
            // ===== State =====
            let currentMode = "agent";
            // T1.5 修复：当前用户选中的 ChatMode（null = 用户未选，后端走 suggestion）
            let currentChatMode = null;
            let isGenerating = false;
            let currentTurnId = null;
            let turns = new Map();
            let artifacts = new Map();
            let availableModels = []; // {provider, models: []}
            let currentModel = "";
            const MAX_CHARS = 4000;
            const WARNING_THRESHOLD = 3600;
            let showThinkingGlobal = (function () {
                try {
                    return (
                        localStorage.getItem("codesage_show_thinking") !==
                        "false"
                    );
                } catch (e) {
                    return true;
                }
            })();

            // ===== EventBus =====
            class EventBus {
                constructor() {
                    this.handlers = new Map();
                    this.batchQueue = [];
                    this.batchScheduled = false;
                }
                on(type, handler) {
                    if (!this.handlers.has(type)) this.handlers.set(type, []);
                    this.handlers.get(type).push(handler);
                }
                off(type, handler) {
                    const list = this.handlers.get(type);
                    if (list) {
                        const idx = list.indexOf(handler);
                        if (idx >= 0) list.splice(idx, 1);
                    }
                }
                emit(type, data) {
                    if (type === "text_delta" || type === "thinking_update") {
                        this.batchQueue.push({ type, data });
                        this.scheduleBatch();
                    } else {
                        this.flush(type, data);
                    }
                }
                scheduleBatch() {
                    if (this.batchScheduled) return;
                    this.batchScheduled = true;
                    requestAnimationFrame(() => {
                        this.processBatch();
                        this.batchScheduled = false;
                    });
                }
                processBatch() {
                    if (this.batchQueue.length === 0) return;
                    const queue = this.batchQueue.splice(
                        0,
                        this.batchQueue.length,
                    );
                    // 合并连续的 text_delta
                    const merged = [];
                    let pendingText = null;
                    let pendingTurnId = null;
                    for (const item of queue) {
                        if (item.type === "text_delta") {
                            if (
                                pendingText !== null &&
                                pendingTurnId === item.data.turnId
                            ) {
                                pendingText += item.data.delta;
                            } else {
                                if (pendingText !== null) {
                                    merged.push({
                                        type: "text_delta",
                                        data: {
                                            turnId: pendingTurnId,
                                            delta: pendingText,
                                        },
                                    });
                                }
                                pendingText = item.data.delta;
                                pendingTurnId = item.data.turnId;
                            }
                        } else {
                            if (pendingText !== null) {
                                merged.push({
                                    type: "text_delta",
                                    data: {
                                        turnId: pendingTurnId,
                                        delta: pendingText,
                                    },
                                });
                                pendingText = null;
                                pendingTurnId = null;
                            }
                            merged.push(item);
                        }
                    }
                    if (pendingText !== null) {
                        merged.push({
                            type: "text_delta",
                            data: { turnId: pendingTurnId, delta: pendingText },
                        });
                    }
                    for (const item of merged) {
                        this.flush(item.type, item.data);
                    }
                }

                    const list = this.handlers.get(type);
                    if (list) list.forEach((h) => h(data));
                }

            function formatRelativeTime(timestamp) {
                const now = Date.now();
                const diff = now - timestamp;
                const minute = 60 * 1000;
                const hour = 60 * minute;
                const day = 24 * hour;
                if (diff < minute) return "Just now";
                if (diff < hour) return Math.floor(diff / minute) + "m ago";
                if (diff < day) return Math.floor(diff / hour) + "h ago";
                if (diff < day * 2) return "Yesterday";
                return Math.floor(diff / day) + "d ago";
            }

            // ===== Input =====
            function updateCharCount(textarea) {
                const len = textarea.value.length;
                const counter = document.getElementById("char-counter");
                if (!counter) return;
                counter.textContent = `${len} / ${MAX_CHARS}`;
                counter.className = "char-counter";
                if (len >= MAX_CHARS) {
                    counter.classList.add("danger");
                } else if (len >= WARNING_THRESHOLD) {
                    counter.classList.add("warning");
                }
            }

            function autoResize(textarea) {
                textarea.style.height = "auto";
                textarea.style.height =
                    Math.min(textarea.scrollHeight, 200) + "px";
            }

            let autocompleteQuery = "";
            let autocompleteIndex = -1;
            let autocompleteSuggestions = [];

            function handleInput(event) {
                const textarea = event.target;
                autoResize(textarea);
                let text = textarea.value;
                if (text.length > MAX_CHARS) {
                    textarea.value = text.substring(0, MAX_CHARS);
                    text = textarea.value;
                }
                updateCharCount(textarea);
                const cursorPos = textarea.selectionStart;
                const textBeforeCursor = text.substring(0, cursorPos);
                const lastAtIndex = textBeforeCursor.lastIndexOf("@");
                if (lastAtIndex >= 0) {
                    const textAfterAt = textBeforeCursor.substring(
                        lastAtIndex + 1,
                    );
                    if (!textAfterAt.includes(" ") && textAfterAt.length >= 0) {
                        autocompleteQuery = textAfterAt;
                        requestFileSuggestions(textAfterAt);
                        return;
                    }
                }
                hideAutocomplete();
            }

            function handleKeydown(event) {
                const autocomplete =
                    document.getElementById("file-autocomplete");
                if (autocomplete.classList.contains("visible")) {
                    if (event.key === "ArrowDown") {
                        event.preventDefault();
                        autocompleteIndex = Math.min(
                            autocompleteIndex + 1,
                            autocompleteSuggestions.length - 1,
                        );
                        updateAutocompleteSelection();
                        return;
                    }
                    if (event.key === "ArrowUp") {
                        event.preventDefault();
                        autocompleteIndex = Math.max(autocompleteIndex - 1, -1);
                        updateAutocompleteSelection();
                        return;
                    }
                    if (event.key === "Enter" || event.key === "Tab") {
                        event.preventDefault();
                        if (
                            autocompleteIndex >= 0 &&
                            autocompleteIndex < autocompleteSuggestions.length
                        ) {
                            insertFileReference(
                                autocompleteSuggestions[autocompleteIndex],
                            );
                        }
                        return;
                    }
                    if (event.key === "Escape") {
                        hideAutocomplete();
                        return;
                    }
                }
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
                if (event.key === "Enter" && event.ctrlKey) {
                    event.preventDefault();
                    sendMessage();
                }
                if (event.key === "Escape") {
                    if (isGenerating) {
                        event.preventDefault();
                        stopGeneration();
                    }
                }
                if (
                    event.ctrlKey &&
                    event.shiftKey &&
                    event.key.toLowerCase() === "c"
                ) {
                    event.preventDefault();
                    const turnIds = Array.from(turns.keys());
                    const lastTurnId = turnIds[turnIds.length - 1];
                    if (lastTurnId) copyTurn(lastTurnId);
                    return;
                }
            }

            function requestFileSuggestions(query) {
                if (window.javaBridge) {

                    );

            function showFileSuggestions(suggestions) {
                const container = document.getElementById("file-autocomplete");
                if (suggestions.length === 0) {
                    hideAutocomplete();

                }
                autocompleteSuggestions = suggestions;
                autocompleteIndex = 0;
                container.innerHTML = suggestions
                    .map(
                        (s, i) => `
                <div class="file-suggestion ${i === 0 ? "selected" : ""}" data-index="${i}" onclick="selectSuggestion(${i})">

                    .join("");

            function updateAutocompleteSelection() {
                const container = document.getElementById("file-autocomplete");
                const items = container.querySelectorAll(".file-suggestion");
                items.forEach((item, i) =>
                    item.classList.toggle("selected", i === autocompleteIndex),
                );
                if (autocompleteIndex >= 0 && items[autocompleteIndex]) {
                    items[autocompleteIndex].scrollIntoView({
                        block: "nearest",
                    });
                }
            }

            function selectSuggestion(index) {
                if (index >= 0 && index < autocompleteSuggestions.length) {
                    insertFileReference(autocompleteSuggestions[index]);
                }
            }

            function insertFileReference(suggestion) {
                const textarea = document.getElementById("message-input");
                const text = textarea.value;
                const cursorPos = textarea.selectionStart;
                const textBeforeCursor = text.substring(0, cursorPos);
                const lastAtIndex = textBeforeCursor.lastIndexOf("@");
                if (lastAtIndex >= 0) {
                    const beforeAt = text.substring(0, lastAtIndex);
                    const afterCursor = text.substring(cursorPos);
                    const refText = "@" + suggestion.relativePath;
                    textarea.value = beforeAt + refText + " " + afterCursor;
                    textarea.selectionStart = textarea.selectionEnd =
                        lastAtIndex + refText.length + 1;
                    autoResize(textarea);
                }
                hideAutocomplete();
            }

            function hideAutocomplete() {
                const container = document.getElementById("file-autocomplete");
                container.classList.remove("visible");

                autocompleteSuggestions = [];
                autocompleteIndex = -1;

                hideAutocomplete();
                const welcome = document.getElementById("welcome-state");
                if (welcome) welcome.style.display = "none";

                    const msgPayload = {
                        type: "send_message",
                        content: text,
                        turnId: currentTurnId,
                        model: currentModel,
                    };
                    if (currentChatMode) {
                        msgPayload.chatMode = currentChatMode;
                    }
                    const msg = JSON.stringify(msgPayload);
                    try {
                        window.javaBridge.sendMessage(msg);
                    } catch (e) {
                        onError(currentTurnId, "发送消息失败: " + e.message);

                } else {
                    onError(currentTurnId, "Java Bridge 未初始化，请刷新页面");

            function switchChatMode(mode) {

                                mode: mode,

                        );
                    } catch (e) {
                        console.error("[switchChatMode] failed:", e);
                    }
                }
            }

            let turnTimers = new Map();
            let turnSafetyTimeouts = new Map();

            function startTurnTimer(turnId) {
                const startTime = Date.now();
                const timer = setInterval(() => {
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(
                        1,
                    );
                    const timerEl = document.getElementById(turnId + "-timer");
                    if (timerEl) timerEl.textContent = elapsed + "s";
                }, 100);
                turnTimers.set(turnId, timer);

                // 安全超时：如果 2 分钟内没有收到 turn_complete，强制重置状态
                const safetyTimeout = setTimeout(() => {
                    console.warn(
                        `[Safety] Turn ${turnId} timed out after 2 minutes, resetting isGenerating`,
                    );
                    isGenerating = false;
                    currentTurnId = null;
                    stopTurnTimer(turnId);
                    turnSafetyTimeouts.delete(turnId);
                    const contentEl = document.getElementById(
                        turnId + "-content",
                    );
                    if (contentEl && contentEl.textContent.trim() === "▌") {
                        contentEl.innerHTML =
                            '<div style="color:var(--error-color);font-size:14px;"><i class="fas fa-exclamation-circle mr-1"></i> 响应超时，请重试</div>';
                    }
                    document
                        .getElementById("send-btn")
                        .classList.remove("hidden");
                    document.getElementById("stop-btn").classList.add("hidden");
                    const status = document.getElementById("status-label");
                    status.textContent = "就绪";
                    status.className = "status-text";
                }, 120000);
                turnSafetyTimeouts.set(turnId, safetyTimeout);
            }

            function stopTurnTimer(turnId) {
                const timer = turnTimers.get(turnId);
                if (timer) {
                    clearInterval(timer);
                    turnTimers.delete(turnId);
                }
                const safety = turnSafetyTimeouts.get(turnId);
                if (safety) {
                    clearTimeout(safety);
                    turnSafetyTimeouts.delete(turnId);
                }
            }

            // ===== Code Block Enhancement =====
            function enhanceCodeBlocks(container) {
                container.querySelectorAll("pre").forEach((pre) => {
                    if (pre.closest(".code-block")) return;
                    const code = pre.querySelector("code");
                    const langMatch = code?.className?.match(/language-(\w+)/);

                    const wrapper = document.createElement("div");
                    wrapper.className = "code-block";
                    const header = document.createElement("div");
                    header.className = "code-block-header";
                    header.innerHTML = `

                    wrapper.appendChild(header);
                    wrapper.appendChild(pre.cloneNode(true));

            function copyCodeBlock(btn) {

            function openCodeBlockInNewWindow(btn) {
                const block = btn.closest(".code-block");
                const code = block?.querySelector("code");
                if (!code) return;
                const win = window.open("about:blank", "_blank");
                if (win) {
                    const text = code.textContent;
                    win.document.write(
                        `<!doctype html><html><head><meta charset="utf-8"><title>Code</title><style>body{background:#1e1e2e;color:#c0c0d0;font-family:monospace;padding:20px;margin:0;white-space:pre-wrap;word-break:break-all;line-height:1.6;font-size:13px;}</style></head><body>${escapeHtml(text)}</body></html>`,
                    );

            // ===== Utilities =====
            function scrollToBottom() {
                const container = document.getElementById("messages-container");
                container.scrollTop = container.scrollHeight;

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            function escapeJs(text) {
                return text
                    .replace(/\\/g, "\\\\")
                    .replace(/'/g, "\\'")
                    .replace(/"/g, '\\"');
            }

            function sanitizeHtml(html) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                doc.querySelectorAll(
                    "script, style, iframe, object, embed, form",
                ).forEach((el) => el.remove());
                const walk = (node) => {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        const attrs = Array.from(node.attributes);
                        for (const attr of attrs) {
                            const name = attr.name.toLowerCase();
                            if (
                                name.startsWith("on") ||
                                (name === "href" &&
                                    /^(javascript|data|vbscript):/i.test(
                                        attr.value,
                                    )) ||
                                name === "action"
                            ) {
                                node.removeAttribute(attr.name);
                            }
                        }
                    }
                    Array.from(node.childNodes).forEach(walk);
                };
                walk(doc.body);
                return doc.body.innerHTML;
            }

            function renderMarkdown(text) {
                if (typeof marked === "undefined") return escapeHtml(text);
                const rawHtml = marked.parse(text);
                return sanitizeHtml(rawHtml);
            }

            // ===== Kotlin Bridge =====
            window.onJavaMessage = function (msg) {
                try {
                    const data =
                        typeof msg === "string" ? JSON.parse(msg) : msg;
                    switch (data.type) {
                        case "text_delta":
                            eventBus.emit("text_delta", data);
                            break;
                        case "thinking_start":
                            eventBus.emit("thinking_start", data);
                            break;
                        case "thinking_update":
                            eventBus.emit("thinking_update", data);
                            break;
                        case "thinking_complete":
                            eventBus.emit("thinking_complete", data);
                            break;
                        case "tool_call_start":
                            eventBus.emit("tool_call_start", data);
                            break;
                        case "tool_call_delta":
                            eventBus.emit("tool_call_delta", data);
                            break;
                        case "tool_call_complete":
                            eventBus.emit("tool_call_complete", data);
                            break;
                        case "tool_call_error":
                            eventBus.emit("tool_call_error", data);
                            break;
                        case "tool_confirmation_needed":
                            eventBus.emit("tool_confirmation_needed", data);
                            break;
                        // T1.5 修复：后端发出 ChatMode 自动建议事件
                        case "mode_suggestion":
                            handleModeSuggestion(data);
                            break;
                        case "turn_complete":
                            eventBus.emit("turn_complete", data);
                            break;
                        case "error":
                            eventBus.emit("error", data);
                            break;
                        case "artifact":
                            addArtifact(
                                data.artifactId,
                                data.title,
                                data.language,
                                data.content,
                            );
                            break;
                        case "set_theme":
                            setTheme(data.theme);
                            break;
                        case "set_model":
                            setCurrentModel(data.model, data.provider);
                            break;
                        case "set_models":
                            setAvailableModels(data.models);
                            break;
                        case "add_user_message":
                            addUserMessage(data.content);
                            break;
                        case "clear":
                            clearChat();
                            break;
                        case "file_suggestions":
                            showFileSuggestions(data.suggestions);
                            break;
                        case "file_references":
                            showFileReferences(data.turnId, data.references);
                            break;
                        case "plan_generated":
                            eventBus.emit("plan_generated", data);
                            break;
                        case "plan_approved":
                            eventBus.emit("plan_approved", data);
                            break;
                        case "plan_rejected":
                            eventBus.emit("plan_rejected", data);
                            break;
                        case "context_compressed":
                            eventBus.emit("context_compressed", data);
                            break;
                        case "session_migrated":
                            eventBus.emit("session_migrated", data);
                            break;
                        case "set_sessions":
                            onSessionsUpdated(data.sessions);
                            break;
                        case "session_created":
                            onSessionCreated(data.session);
                            break;
                        case "session_switched":
                            onSessionSwitched(data.sessionId);
                            break;
                        case "session_deleted":
                            onSessionDeleted(data.sessionId);
                            break;
                        case "session_renamed":
                            onSessionRenamed(data.sessionId, data.name);
                            break;
                        case "load_history":
                            loadHistory(data.messages);
                            break;
                        default:
                            console.warn("Unknown message type:", data.type);
                    }
                } catch (e) {
                    console.error("Failed to handle message:", e, "Raw:", msg);
                }
            };

            window.sendMessageToJava = function (json) {
                if (window.javaBridge) window.javaBridge.sendMessage(json);
            };

            // ===== Offline Health Check =====
            initThinkingToggle();

            window.checkCriticalLibraries = function () {
                return (
                    typeof marked !== "undefined" &&
                    typeof hljs !== "undefined" &&
                    typeof window.javaBridge !== "undefined"
                );
            };

            window.requestSessions = function () {
                if (window.javaBridge) {
                    window.javaBridge.sendMessage(
                        JSON.stringify({ type: "request_sessions" }),
                    );
                }
            };

            window.showOfflineWarning = function () {
                if (document.getElementById("codesage-offline-warning")) return;
                const div = document.createElement("div");
                div.id = "codesage-offline-warning";
                div.className = "offline-warning";
                div.innerHTML = `
                <div style="text-align:center;padding:20px;">
                    <div style="width:48px;height:48px;border-radius:12px;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;color:var(--warning-color);"><i class="fas fa-exclamation-triangle"></i></div>
                    <h2 style="margin-bottom:8px;font-size:18px;font-weight:600;">加载异常</h2>
                    <p style="margin-bottom:20px;color:var(--text-secondary);font-size:14px;">CodeSage 界面加载异常，部分资源可能缺失。</p>
                    <button class="reload-btn" onclick="reloadPage()">重载界面</button>
                </div>
            `;
                document.body.appendChild(div);
            };

            function reloadPage() {
                if (window.javaBridge) {
                    window.javaBridge.sendMessage(
                        JSON.stringify({ type: "reload_browser" }),
                    );
                } else {
                    location.reload();
                }
            }
        </script>
    </body>
</html>
